# Профиль сценария «одна камера — один человек»: структурированное интервью (опрос, собеседование).
# Пороги детекторов моментов, требующих внимания, и веса значимости. Вероятности — итоговые (лицо + голос)
# по секундам; расстояния — Дженсена — Шеннона по основанию 2 (0 — одинаково, 1 — совсем разное).
# Числа предварительные: уточняются на реальных записях.

name: interview
title: Структурированное интервью (один человек)
description: >
  Опрос пациента, собеседование или интервью одного человека. Внимания требуют резкие смены выраженной эмоции,
  устойчивые гнев и грусть, расхождение лица и голоса и долгие периоды бедной мимики.

merge_gap_s: 2

significance:
  ref_duration_s: 30
  extra_type_bonus: 0.1
  levels:
    high: 0.6
    medium: 0.35

detectors:
  sustained:
    emotions:
      anger: {weight: 1.0}
      sad: {weight: 1.0}
    enter_p: 0.6
    exit_delta: 0.1
    min_duration_s: 8
    max_gap_s: 2

  abrupt_change:
    weight: 0.8
    window_s: 3
    min_jsd: 0.3
    min_new_p: 0.5
    min_coverage: 0.67
    suppress_s: 5

  face_voice_divergence:
    weight: 0.6
    min_p: 0.5
    min_jsd: 0.3
    min_speech: 0.5
    min_duration_s: 4
    max_gap_s: 2

  flat_affect:
    weight: 0.5
    window_s: 60
    max_variability: 0.03
    min_coverage: 0.7

# Для объяснений модели (агент): на что смотреть в этом сценарии и чего не утверждать
prompt_notes: >
  Сценарий — интервью одного человека. Особенно важны устойчивая грусть и бедная мимика при опросе пациента и
  резкие смены при обсуждении сложных тем. Это поводы для внимания специалиста, а не признаки болезни, усталости
  или неискренности.
