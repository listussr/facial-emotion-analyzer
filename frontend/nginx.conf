# Affectra frontend
#
# - HTTP на 80 и HTTPS на 443: камера браузера с других устройств работает только по HTTPS.
#   Сертификат — /etc/nginx/certs/affectra.{crt,key}; если его нет, при старте создаётся самоподписанный
#   (docker-entrypoint.d/10-affectra-cert.sh).
# - отдаём SPA из /usr/share/nginx/html (роутинг через index.html)
# - HTTP-эндпоинты /api/*           → webapp:8000
# - WebSocket /api/events/*, /api/live/* → webapp:8000, /api/capture/* → ingest:8001 (с upgrade)
# - MJPEG /api/stream/*             → webapp:8000 (отдельный location, чтобы не
#                                     было буферизации)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    include /etc/nginx/affectra-locations.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/affectra.crt;
    ssl_certificate_key /etc/nginx/certs/affectra.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/affectra-locations.conf;
}
