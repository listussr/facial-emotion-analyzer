# Affectra frontend
#
# - отдаём SPA из /usr/share/nginx/html (роутинг через index.html)
# - HTTP-эндпоинты /api/*           → webapp:8000
# - WebSocket /api/events/*         → webapp:8000 (с upgrade)
# - MJPEG /api/stream/*             → webapp:8000 (отдельный location, чтобы не
#                                     было буферизации)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Большие загрузки видео
    client_max_body_size 2g;

    # SPA: статика + history-fallback на index.html
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket для событий аналитики — нужен upgrade-handshake
    location /api/events/ {
        proxy_pass http://webapp:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # MJPEG-стрим: отключаем буферизацию, иначе картинка дёргается
    location /api/live/ {
        proxy_pass http://webapp:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location /api/stream/ {
        proxy_pass http://webapp:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Всё остальное API
    location /api/ {
        proxy_pass http://webapp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
