# Общие директивы HTTP- и HTTPS-сервера: SPA и прокси API (подключается из default.conf)

# Большие загрузки видео
client_max_body_size 2g;

# SPA: статика + history-fallback на index.html
root /usr/share/nginx/html;
index index.html;

location / {
    try_files $uri $uri/ /index.html;
}

# WebSocket для событий аналитики — нужен upgrade-handshake
location /api/events/ {
    proxy_pass http://webapp:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
}

location /api/live/ {
    proxy_pass http://webapp:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
}

# Камера и микрофон браузера — сразу в сервис приёма медиа
location /api/capture/ {
    proxy_pass http://ingest:8001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
}

# Записи сессий отдаются потоком из хранилища, с поддержкой Range
location /api/recordings {
    proxy_pass http://webapp:8000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header Range $http_range;
    proxy_read_timeout 300s;
}

# MJPEG-стрим: отключаем буферизацию, иначе картинка дёргается
location /api/stream/ {
    proxy_pass http://webapp:8000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
}

# Всё остальное API
location /api/ {
    proxy_pass http://webapp:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
}
